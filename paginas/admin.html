<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda académica de videojuegos, consolas y accesorios Sikosis Gaming.">
    <title>Panel de gestión | Sikosis Gaming</title>
    <!-- Bootstrap organiza la interfaz. estilos.css personaliza los colores y el diseño. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/estilos.css" rel="stylesheet">
    <!-- defer permite que el HTML esté listo antes de ejecutar JavaScript. El orden importa. -->
    <script src="../js/datos.js" defer></script>
    <script src="../js/regiones.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/admin.js" defer></script>
</head>
<body>
        <a class="saltar" href="#contenido">
            Saltar al contenido
        </a>
        <!-- Menú visible también en celular: no necesita JavaScript para abrirse. -->
        <header>
            <nav class="container py-3" aria-label="Navegación principal">
                <div class="barra">
                    <a class="marca" href="Inicio.html">
                        <img class="logo" src="../imagenes/SG_logo.png" alt="Logo SG de Sikosis Gaming" width="80" height="62">
                        Sikosis Gaming
                    </a>
                    <ul class="nav">
                        <li class="nav-item">
                            <a class="nav-link activo" href="Inicio.html" aria-current="page">
                                Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="producto.html">
                                Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">
                                Nosotros
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="blog.html">
                                Blog
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">
                                Contacto
                            </a>
                        </li>
                    </ul>
                    <a class="btn boton-verde" href="carrito.html">
                        Carrito
                    </a>
                </div>
            </nav>
        </header>
    <main class="container py-4" id="contenido" tabindex="-1">
        <div class="cuenta mb-4">
            <a href="login.html">Iniciar sesión</a> | <a href="registro.html">Registrarse</a>
        </div>
        <div id="aviso" class="aviso" role="status" aria-live="polite" aria-atomic="true" hidden></div>

        <div class="admin-grid">
            <nav id="menu-admin" class="menu-admin" aria-label="Menú de gestión"></nav>
            <section id="panel-admin" class="panel p-4" aria-label="Contenido de gestión"></section>
        </div>

        <!-- Las plantillas son HTML inactivo hasta que admin.js las copia al panel. -->
        <template id="plantilla-producto">
            <h1 id="titulo-producto">Nuevo producto</h1>
            <form id="form-producto" class="formulario" aria-label="Datos del producto">
                <div class="mb-3">
                    <label class="form-label" for="codigo">Código</label>
                    <input class="form-control" id="codigo" name="codigo" type="text" required minlength="3">
                    <small>Único. El código se conserva al editar.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="nombre-producto">Nombre</label>
                    <input class="form-control" id="nombre-producto" name="nombre-producto" type="text" required maxlength="100">

                </div>

                <div class="mb-3"><label for="descripcion">Descripción (opcional)</label>
                    <textarea class="form-control" id="descripcion" maxlength="500" rows="4"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="precio">Precio</label>
                    <input class="form-control" id="precio" name="precio" type="number" required min="0" step="any">

                </div>
                <div class="mb-3">
                    <label class="form-label" for="stock">Stock</label>
                    <input class="form-control" id="stock" name="stock" type="number" required min="0" step="1">

                </div>
                <div class="mb-3">
                    <label class="form-label" for="critico">Stock crítico (opcional)</label>
                    <input class="form-control" id="critico" name="critico" type="number" min="0" step="1">
                    <small>Se muestra una alerta cuando el stock es igual o menor que este valor.</small>
                </div>

                <div class="mb-3"><label for="categoria-producto">Categoría</label>
                    <select class="form-select" id="categoria-producto" required><option value="">Selecciona una categoría</option></select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="imagen">Imagen (opcional)</label>
                    <input class="form-control" id="imagen" name="imagen" type="text" >
                    <small>Ruta local imagenes/archivo.jpg o enlace HTTPS. Sin imagen se usa el logo.</small>
                </div>

                <button class="btn boton-verde" type="submit">Guardar producto</button>
                <a href="admin.html?vista=productos">Cancelar</a>
            </form>
        </template>

        <template id="plantilla-usuario">
            <h1 id="titulo-usuario">Nuevo usuario</h1>
            <p id="ayuda-clave-admin">Ingresa una contraseña de demostración para la nueva cuenta.</p>
            <form id="form-usuario" class="formulario" aria-label="Datos del usuario">
                <div class="mb-3">
                    <label class="form-label" for="run">RUN (sin puntos ni guion)</label>
                    <input class="form-control" id="run" name="run" type="text" required minlength="7" maxlength="9" aria-describedby="run-ayuda">
                    <small id="run-ayuda">Ejemplo válido: 123456785. Se comprueba el dígito verificador.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre" name="nombre" type="text" required maxlength="50" autocomplete="given-name">

                </div>
                <div class="mb-3">
                    <label class="form-label" for="apellidos">Apellidos</label>
                    <input class="form-control" id="apellidos" name="apellidos" type="text" required maxlength="100" autocomplete="family-name">

                </div>
                <div class="mb-3">
                    <label class="form-label" for="correo-registro">Correo electrónico</label>
                    <input class="form-control" id="correo-registro" name="correo-registro" type="email" required maxlength="100" autocomplete="email" aria-describedby="correo-ayuda">
                    <small id="correo-ayuda">Usa @duoc.cl, @profesor.duoc.cl o @gmail.com.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="nacimiento">Fecha de nacimiento (opcional)</label>
                    <input class="form-control" id="nacimiento" name="nacimiento" type="date" autocomplete="bday">

                </div>
                <div class="mb-3">
                    <label class="form-label" for="direccion">Dirección</label>
                    <input class="form-control" id="direccion" name="direccion" type="text" required maxlength="300" autocomplete="street-address">

                </div>
                <div class="mb-3">
                    <label class="form-label" for="clave-registro">Contraseña</label>
                    <input class="form-control" id="clave-registro" name="clave-registro" type="password" required minlength="4" maxlength="10" autocomplete="new-password" aria-describedby="clave-ayuda">
                    <small id="clave-ayuda">Entre 4 y 10 caracteres. Usa una contraseña de prueba.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmar-clave">Confirmar contraseña</label>
                    <input class="form-control" id="confirmar-clave" name="confirmar-clave" type="password" required minlength="4" maxlength="10" autocomplete="new-password">

                </div>

                <!-- Ambos select se completan desde el arreglo regiones.js. -->
                <div class="mb-3"><label for="region">Región</label>
                    <select class="form-select" id="region" name="region" required></select>
                </div>
                <div class="mb-3"><label for="comuna">Comuna</label>
                    <select class="form-select" id="comuna" name="comuna" required disabled></select>
                </div>

                <div class="mb-3"><label for="rol">Perfil</label>
                    <select class="form-select" id="rol" required><option>Cliente</option><option>Vendedor</option><option>Administrador</option></select>
                </div>
                <div class="mb-3"><label for="activo">Estado</label>
                    <select class="form-select" id="activo" required><option value="si">Activo</option><option value="no">Desactivado</option></select>
                </div>
                <button class="btn boton-verde" type="submit">Guardar usuario</button>
                <a href="admin.html?vista=usuarios">Cancelar</a>
            </form>
        </template>

    </main>
        <footer class="mt-4 py-4">
            <div class="container row-pie">
                <div>
                    <strong>
                        Sikosis Gaming
                    </strong>
                    <p class="mb-0">
                        Videojuegos y accesorios para tu próxima partida.
                    </p>
                    <small>
                        © 2026 Sikosis Gaming.
                    </small>
                </div>
                <nav aria-label="Categorías">
                    <a href="producto.html?categoria=Accesorios">
                        Accesorios
                    </a>
                    <br>
                    <a href="producto.html?categoria=Videojuegos">
                        Videojuegos
                    </a>
                </nav>
            </div>
        </footer>
    <noscript><p class="aviso">Activa JavaScript para usar los formularios, productos y carrito.</p></noscript>
</body>
</html>
